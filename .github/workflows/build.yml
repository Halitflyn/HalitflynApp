name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer

    - name: Accept SDK Licenses and Build APK
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk
        export BUILDOZER_ACCEPT_SDK_LICENSES=1
        # Запускаємо buildozer і через yes автоматично погоджуємося на всі запити ліцензій
        yes y | buildozer -v android debug || yes y | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
